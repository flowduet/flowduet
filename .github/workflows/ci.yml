name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  verify:
    name: Lint + Test + Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: 产物可被 Node 原生 ESM 导入（防 extensionless 回归）
        run: |
          node --input-type=module -e "import('./packages/core/dist/index.js').then(m => { if (!m.CORE_VERSION) throw new Error('CORE_VERSION 缺失'); console.log('dist 导入 OK', m.CORE_VERSION); })"
